services:
  db:
    image: postgres:17.11
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20"]
    environment:
      POSTGRES_DB: appointments
      POSTGRES_USER: appointments
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Demo generates DB_PASSWORD}
    mem_limit: 256m
    volumes:
      - demo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U appointments -d appointments"]
      interval: 3s
      timeout: 3s
      retries: 30
  app:
    image: appointment-booking:local
    environment:
      DB_URL: jdbc:postgresql://db:5432/appointments
      DB_USER: appointments
      DB_PASSWORD: ${DB_PASSWORD:?Demo generates DB_PASSWORD}
      BOOTSTRAP_STAFF_ENABLED: 'true'
      BOOTSTRAP_STAFF_EMAIL: staff@demo.example.test
      BOOTSTRAP_STAFF_PASSWORD: ${DEMO_STAFF_PASSWORD:?Demo generates staff password}
    ports:
      - "127.0.0.1::8080"
    mem_limit: 512m
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
volumes:
  demo_data:
