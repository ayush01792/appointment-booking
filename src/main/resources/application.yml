server:
  shutdown: graceful
  forward-headers-strategy: none
  port: ${PORT:8080}
spring:
  application:
    name: appointment-booking
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/appointments}
    username: ${DB_USER:appointments}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 6
      connection-init-sql: "SET lock_timeout = '5s'"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
